services:
  db:
    image: postgres:16-alpine
    container_name: fitbud-db
    environment:
      POSTGRES_USER: ${PGUSER:-fitbud}
      POSTGRES_PASSWORD: ${PGPASSWORD:-fitbud}
      POSTGRES_DB: ${PGDATABASE:-fitbud}
    ports:
      - "5432:5432"
    volumes:
      - fitbud-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-fitbud} -d ${PGDATABASE:-fitbud}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - fitbud-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fitbud-server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-fitbud}
      PGPASSWORD: ${PGPASSWORD:-fitbud}
      PGDATABASE: ${PGDATABASE:-fitbud}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET musi byt nastaven v .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fitbud-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fitbud-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - fitbud-network

volumes:
  fitbud-pgdata:
    driver: local

networks:
  fitbud-network:
    driver: bridge

